{% extends "base.html" %}
{% block title %}{{ 'Edit' if action else 'New' }} Action — Action Tracker{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ 'Edit Action #' ~ action.id if action else 'New Action' }}</h1>
    <a href="{{ url_for('actions.list_actions') }}" class="btn btn-outline btn-sm">Cancel</a>
</div>

<div class="card">
<form method="post">
    <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title" value="{{ action.title if action else '' }}" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description">{{ action.description if action and action.description else '' }}</textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="category_id">Category *</label>
            <select id="category_id" name="category_id" required>
                <option value="">— Select —</option>
                {% for c in categories %}
                <option value="{{ c.id }}" {% if action and action.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                {% for p in ['Critical','High','Medium','Low'] %}
                <option value="{{ p }}" {% if action and action.priority == p %}selected{% elif not action and p == 'Medium' %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="status_id">Status *</label>
            <select id="status_id" name="status_id" required>
                {% for s in statuses %}
                <option value="{{ s.id }}" {% if action and action.status_id == s.id %}selected{% elif not action and s.sort_order == 0 %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="date_raised">Date Raised *</label>
            <input type="date" id="date_raised" name="date_raised"
                   value="{{ action.date_raised if action else today }}"
                   {% if action %}readonly{% else %}required{% endif %}>
        </div>
        <div class="form-group">
            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date" value="{{ action.due_date if action and action.due_date else '' }}">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="source_committee_id">Source Committee</label>
            <select id="source_committee_id" name="source_committee_id">
                <option value="">— None —</option>
                {% for c in committees %}
                <option value="{{ c.id }}" {% if action and action.source_committee_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="reporting_committee_id">Reporting Committee</label>
            <select id="reporting_committee_id" name="reporting_committee_id">
                <option value="">— None —</option>
                {% for c in committees %}
                <option value="{{ c.id }}" {% if action and action.reporting_committee_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="department_id">Department</label>
            <select id="department_id" name="department_id">
                <option value="">— None —</option>
                {% for d in departments %}
                <option value="{{ d.id }}" {% if action and action.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="owner_id">Owner</label>
            <select id="owner_id" name="owner_id">
                <option value="">— None —</option>
                {% for u in users %}
                <option value="{{ u.id }}" {% if action and action.owner_id == u.id %}selected{% endif %}>{{ u.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="exec_sponsor_id">Executive Sponsor</label>
            <select id="exec_sponsor_id" name="exec_sponsor_id">
                <option value="">— None —</option>
                {% for u in users %}
                <option value="{{ u.id }}" {% if action and action.exec_sponsor_id == u.id %}selected{% endif %}>{{ u.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    {% if action %}
    <div class="form-group">
        <label for="closure_evidence">Closure Evidence / Sign-off</label>
        <textarea id="closure_evidence" name="closure_evidence">{{ action.closure_evidence if action.closure_evidence else '' }}</textarea>
    </div>
    {% endif %}

    <div class="mt-16">
        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if action else 'Create Action' }}</button>
    </div>
</form>
</div>
{% endblock %}
